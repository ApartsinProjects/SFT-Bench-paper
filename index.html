const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:P.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.n)},k,b(P.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  try{const html=await open(pw);
    try{if(remember)sessionStorage.setItem("pw",pw)}catch(_){}
    document.open();document.write(html);document.close();
  }catch(_){document.getElementById("e").textContent="Wrong password.";try{sessionStorage.removeItem("pw")}catch(_){}}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("pw").value,true)});
try{const s=sessionStorage.getItem("pw");if(s)go(s,false)}catch(_){}
